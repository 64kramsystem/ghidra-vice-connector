// Ghidra Extension build for VICE C64 TraceRmi agent.
// Requires GHIDRA_INSTALL_DIR env var or Gradle property.

def ghidraInstallDir
if (System.env.GHIDRA_INSTALL_DIR) {
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
} else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (JavaVersion.current() != JavaVersion.VERSION_25) {
    throw new GradleException("Build this extension with JDK 25.")
}

if (ghidraInstallDir) {
    def metadata = new Properties()
    file("${ghidraInstallDir}/Ghidra/application.properties").withInputStream { metadata.load(it) }
    if (metadata.getProperty('application.version') != '12.2') {
        throw new GradleException("This extension requires Ghidra 12.2.")
    }
    apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
} else {
    throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}

// Ghidra's dependency-copy filter accesses Project at execution time. Capture the
// directories during configuration so the same exclusions work with the cache.
def ghidraHome = file(ghidraInstallDir).canonicalFile
def dependencyDir = file('lib').canonicalFile
def copyExtensionDependencies = tasks.register('copyExtensionDependencies', Copy) {
    group = 'Ghidra Private'
    from configurations.runtimeClasspath
    into dependencyDir
    exclude { entry ->
        def path = entry.file.canonicalFile.toPath()
        path.startsWith(ghidraHome.toPath()) || path.startsWith(dependencyDir.toPath())
    }
}
def inheritedCopyDependencies = tasks.named('copyDependencies').get()
tasks.named('compileJava') {
    setDependsOn(dependsOn.findAll { it != inheritedCopyDependencies })
    dependsOn copyExtensionDependencies
}

repositories {
    mavenCentral()
}

dependencies {
}

// The connector's release version lives in contracts.py, which is what it serves
// over the wire. Read it here so the packaged extension carries the same number
// and an installed copy can be identified without a running connection.
// extension.properties' own `version` is left to Ghidra: buildExtension.gradle
// substitutes @extversion@ from application.version, and the installer gates on
// exactly that field.
def connectorVersion = {
    def declaration = file('src/main/py/src/vice/contracts.py').text
    def match = declaration =~ /(?m)^CONNECTOR_VERSION = "([^"]+)"$/
    if (!match.find()) {
        throw new GradleException('CONNECTOR_VERSION not found in contracts.py')
    }
    return match.group(1)
}()

def schemaOutput = layout.buildDirectory.file('generated/vice/schema.xml')
def buildSchema = tasks.register('buildSchema', Exec) {
    inputs.file('src/main/py/src/vice/schema-base.xml')
    inputs.file('tools/build_schema.py')
    inputs.dir("${ghidraInstallDir}/Ghidra/Debug/Debugger-rmi-trace/pypkg/src/ghidratrace/xml")
    outputs.file(schemaOutput)
    doFirst { schemaOutput.get().asFile.parentFile.mkdirs() }
    commandLine 'python3', 'tools/build_schema.py', ghidraInstallDir,
        '--output', schemaOutput.get().asFile.absolutePath
}

// Preserve executable bit on shell launcher scripts in the zip.
// Exclude Python bytecode, test artifacts, and dev files from the extension zip.
tasks.named('buildExtension') {
    filesMatching('**/*.sh') {
        permissions {
            unix('rwxr-xr-x')
        }
    }
    exclude '**/__pycache__/**'
    exclude '**/*.pyc'
    exclude '**/.pytest_cache/**'
    exclude '.claude/**'
    exclude '.github/**'
    exclude 'tests/**'
    exclude 'test/**'
    exclude 'test_vice.py'
    exclude 'pytest.ini'
    exclude 'AGENTS.md'
    exclude 'tools/**'
    exclude '**/schema-base.xml'
    exclude 'data/ghidra-project/**'
    exclude 'data/test_raw.bin'

    // Include Python agent source (buildExtension.gradle excludes src/** by default)
    dependsOn buildSchema
    from(schemaOutput) {
        into "${project.name}/src/main/py/src/vice"
    }
    from('src/main/py/src') {
        exclude 'vice/schema.xml'
        into "${project.name}/src/main/py/src"
    }

    // Appended to the packaged copy only; the source file stays untouched.
    filesMatching('**/extension.properties') {
        filter { line ->
            line.startsWith('version=') ? "${line}\nconnectorVersion=${connectorVersion}" : line
        }
    }
}
