// Ghidra Extension build for VICE C64 TraceRmi agent.
// Requires GHIDRA_INSTALL_DIR env var or Gradle property.

def ghidraInstallDir
if (System.env.GHIDRA_INSTALL_DIR) {
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
} else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
    apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
} else {
    throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}

repositories {
    mavenCentral()
}

dependencies {
}

// The connector's release version lives in contracts.py, which is what it serves
// over the wire. Read it here so the packaged extension carries the same number
// and an installed copy can be identified without a running connection.
// extension.properties' own `version` is left to Ghidra: buildExtension.gradle
// substitutes @extversion@ from application.version, and the installer gates on
// exactly that field.
def connectorVersion = {
    def declaration = file('src/main/py/src/vice/contracts.py').text
    def match = declaration =~ /(?m)^CONNECTOR_VERSION = "([^"]+)"$/
    if (!match.find()) {
        throw new GradleException('CONNECTOR_VERSION not found in contracts.py')
    }
    return match.group(1)
}()

// Preserve executable bit on shell launcher scripts in the zip.
// Exclude Python bytecode, test artifacts, and dev files from the extension zip.
tasks.named('buildExtension') {
    filesMatching('**/*.sh') {
        permissions {
            unix('rwxr-xr-x')
        }
    }
    exclude '**/__pycache__/**'
    exclude '**/*.pyc'
    exclude '**/.pytest_cache/**'
    exclude '.claude/**'
    exclude '.github/**'
    exclude 'tests/**'
    exclude 'test/**'
    exclude 'test_vice.py'
    exclude 'pytest.ini'
    exclude 'data/ghidra-project/**'
    exclude 'data/test_raw.bin'

    // Include Python agent source (buildExtension.gradle excludes src/** by default)
    from('src/main/py/src') {
        into "${project.name}/src/main/py/src"
    }
    from('contracts') {
        into "${project.name}/contracts"
    }

    // Appended to the packaged copy only; the source file stays untouched.
    filesMatching('**/extension.properties') {
        filter { line ->
            line.startsWith('version=') ? "${line}\nconnectorVersion=${connectorVersion}" : line
        }
    }
}
