name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Cancel in-progress runs for the same ref (PR/branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build only against the supported Ghidra and JDK baseline.
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Download Ghidra 12.2
      run: |
        curl -fL --retry 3 -o "$RUNNER_TEMP/ghidra.zip" \
          https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
        7z x -bd -o"$RUNNER_TEMP" "$RUNNER_TEMP/ghidra.zip"
        echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra_12.2_PUBLIC" >> "$GITHUB_ENV"

    - name: Build extension
      run: ./gradlew --no-daemon clean buildExtension

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ghidra-vice-connector
        path: dist/*.zip
        if-no-files-found: error

  # Unit/integration tests for the Python TraceRmi agent. conftest.py stubs the
  # ghidratrace modules, so no Ghidra install is needed; the live-VICE suite runs
  # against a headless x64sc booted below. Runs in parallel with build.
  python-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install pytest
      run: pip install pytest

    # NB: this apt package is whatever the runner image ships, which predates
    # r46020. The live display-capture tests therefore SKIP here: before that
    # revision VICE overruns its own allocation while answering `display get`,
    # so the connector's build guard refuses to send the command and those
    # tests decline to run rather than trigger the bug. Pinning this install to
    # r46020 or later -- or building VICE from source -- is what turns them on.
    - name: Install VICE
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends vice xvfb netcat-openbsd

    - name: Provision VICE C64 ROMs
      uses: ./.github/actions/provision-vice-roms

    # The live-VICE suite needs only a booted machine with the binary monitor open.
    - name: Start VICE with the binary monitor
      run: |
        xvfb-run -a x64sc \
          -binarymonitor -binarymonitoraddress ip4://127.0.0.1:6502 \
          -sounddev dummy \
          -kernal  "$VICE_C64_ROM_DIR/kernal-901227-03.bin" \
          -basic   "$VICE_C64_ROM_DIR/basic-901226-01.bin" \
          -chargen "$VICE_C64_ROM_DIR/chargen-901225-01.bin" \
          > "$RUNNER_TEMP/vice.log" 2>&1 &
        for _ in $(seq 1 60); do
          nc -z 127.0.0.1 6502 && exit 0
          sleep 1
        done
        echo "VICE binary monitor port never opened" >&2
        tail -40 "$RUNNER_TEMP/vice.log" >&2
        exit 1

    # REQUIRE_LIVE_VICE turns the live suite's not-reachable auto-skip into a failure:
    # a VICE boot regression must not turn the suite into a silent no-op.
    - name: Run tests
      env:
        REQUIRE_LIVE_VICE: 1
      run: pytest
